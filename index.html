window.__start=function(){

/* layers: n, r0, dr, rmin, drmin, y0, a0, da, bend, H, dH, W, roll, ao, color, azimuth step */

 [6,.0095,.0011,.006,.0009,-.001,.04,0,-.2,.052,.001,.015,0,.72,"#B8667F",1.0472],

   Three lightweight silhouette options are built only once, not on every edit. */
function sleeveGeometry(fold){

  rgb.push(shade,shade*.989,shade*.98)

  const t=row/(steps.length-1),q=steps[row];
  for(let i=0;i<=n;i++){
   const a=i*2*Math.PI/n;
   const crease=Math.cos(a*folds+.12);
   const rr=q.r*(1+ripple*t*t*crease+.009*t*Math.cos(a*4));
   const y=q.y+(row===steps.length-1?topWave*(.58+.42*Math.cos(a*folds/2+.18)):0)*Math.cos(a*folds+.15);
   vertex(a,rr,y,crease,row)

 }
 // Turned-over narrow lip shares this geometry/draw call but has darker back-facing folds.

  CATALOG.filter(a=>(!flt.q||(a.name+a.sci).toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.cat||a.cat===flt.cat)&&(!flt.av||a.status===flt.av)).forEach(a=>{h+=`<div class=r><div style="flex:1"><b>${esc(a.name)}</b><br><small>${esc(a.sci||a.cat)} · ${a.status==="available"?"installed":a.status==="loading"?"loading…":a.status==="failed"?"failed: "+esc(a.err||"unknown"):"planned, not installed"}${a.note?" · "+esc(a.note):""}${a.lic&&a.lic!=="n/a"?" · "+esc(a.lic):""}${a.license&&a.license.attribution_required?" · attribution: "+esc(a.author||""):""}</small>${a.license&&/^https:\/\//.test(a.license.source_url||"")?`<a class="asset-source" href="${esc(a.license.source_url)}" target="_blank" rel="noopener noreferrer">View asset source</a>`:""}</div><button data-add="${a.id}" ${a.status!=="available"?"disabled":""} style="flex:0 0 64px">Add</button></div>`});
  {const n=f=>CATALOG.filter(f).length,ext=n(a=>a.status==="available"&&a.origin==="manifest"),imp=n(a=>a.status==="available"&&a.cat==="Imported"),pl=n(a=>a.status==="missing"),fl=n(a=>a.status==="failed");h+=`<small>${ext} loaded external · ${imp} imported · 1 built-in fallback · ${pl} planned${fl?" · "+fl+" failed":""}. ${esc(manifestInfo)}. Import GLB files under Save.</small>`;const cr=CATALOG.filter(a=>a.status==="available"&&a.license&&a.license.attribution_required);if(cr.length)h+=`<small>Credits: ${cr.map(a=>esc(a.name)+" by "+esc(a.author)+" ("+esc(a.license.name)+(a.modified?", modified":"")+")").join("; ")}</small>`}}
 else if(tab==="arrange"){h+=`<div class=r><button data-m="simple" aria-pressed="${mode==="simple"}">Simple</button><button data-m="adv" aria-pressed="${mode==="adv"}">Advanced</button></div><div>${bq.items.length}/${MAXN} flowers · ${it?"Selected #"+it.id+" "+esc(asset(it.a)?.name||"Unavailable: "+it.a):"Tap a flower to select"}</div>`;
  if(mode==="simple")h+=`<label>Arrangement style<select id=layout aria-label="Arrangement style">${[["dome","Romantic dome"],["spiral","Florist spiral"],["garden","Wild garden"]].map(([k,v])=>`<option value="${k}" ${(bq.layout||"dome")===k?"selected":""}>${v}</option>`).join("")}</select></label><div class=r><button data-a="dup">+1 same</button><button data-a="del">Remove</button></div><div class=r><button data-a="auto">Auto Arrange</button><button data-a="seed">New seed (${bq.seed})</button></div><label>Spread<input type=range id=fu min=.7 max=1.6 step=.05 value=${bq.full}></label>`;
  else if(it)h+=sl("x","Left / right",-.65,.65,.002,it.x)+sl("z","Front / back",-.65,.65,.002,it.z)+sl("y","Height",.2,.46,.002,it.y)+sl("r","Rotation",0,6.28,.05,it.r)+sl("s","Scale",.6,1.5,.02,it.s)+`<div class="r nudge-row"><button data-nudge="x:-.01" aria-label="Move left">← X</button><button data-nudge="x:.01" aria-label="Move right">X →</button><button data-nudge="z:-.01" aria-label="Move back">← Z</button><button data-nudge="z:.01" aria-label="Move forward">Z →</button></div><div class="r nudge-row"><button data-nudge="y:-.01">Lower</button><button data-nudge="y:.01">Raise</button><button data-a="done">Done</button></div><div class=r><button data-a="rst">Reset flower</button><button data-a="del">Remove</button></div>`;else h+="<small>Select a flower to edit it.</small>"}
 else if(tab==="style"){
 const A=it&&asset(it.a),w=normalizeWrap(bq.wrap);
 h+=`<b>Flower colors</b>`;
 h+=A&&A.colors?`<div class=r>${A.colors.map(c=>`<button data-col="${c}" aria-pressed="${it.c===c}">${COLS[c][0]}</button>`).join("")}</div><div class=r><button data-a="colall">Apply this color to all roses</button></div>`:"<small>Select a procedural flower to adjust its petals; imported 3D models retain their original textures.</small>";
 h+=`<div class="style-section"><b>Florist presentation</b><div class=r>
  <button data-wrap-toggle aria-pressed="${w.enabled}">${w.enabled?"✓ Wrapped":"○ Bare stems"}</button>
  <button data-ribbon-toggle aria-pressed="${w.ribbon}">${w.ribbon?"✓ Ribbon":"○ No ribbon"}</button></div>
  <small>Lightweight 3D folded paper below the blooms, with an optional bow. Changes are saved with the bouquet.</small>
  <label>Paper silhouette</label><div class="swatches" role="group" aria-label="Wrapping fold">
   ${Object.entries(FOLDS).map(([k,name])=>`<button data-fold="${k}" aria-pressed="${w.fold===k}">${name}</button>`).join("")}</div>
  <label>Wrapping paper</label><div class="swatches" role="group" aria-label="Wrapping paper color">${Object.entries(PAPER).map(([k,[name,color]])=>`<button data-paper="${k}" aria-pressed="${w.paper===k}"><span class="swatch-dot" style="background:#${color.toString(16).padStart(6,"0")}"></span>${name}</button>`).join("")}</div>
  <label>Ribbon</label><div class="swatches" role="group" aria-label="Ribbon color">${Object.entries(BOW).map(([k,[name,color]])=>`<button data-bow="${k}" aria-pressed="${w.bow===k}"><span class="swatch-dot" style="background:#${color.toString(16).padStart(6,"0")}"></span>${name}</button>`).join("")}</div></div>`
}

  if(L)h+=`<small>${esc(L.name)}: ${L.tris} tris, ${L.note}</small><label>Scale<input type=range data-adj=sc min=.5 max=2 step=.05 value=${L.adj.sc}></label><label>Rotation<input type=range data-adj=rot min=0 max=6.28 step=.05 value=${L.adj.rot}></label><label>Vertical offset<input type=range data-adj=off min=-.1 max=.1 step=.005 value=${L.adj.off}></label>`}
 p.innerHTML=h}
function updUI(){panel();syncRing();$("bUndo").disabled=hix<=0;$("bRedo").disabled=hix>=hist.length-1;updateSheet()}

 if(d.add)addFlower(d.add);

 }
 else if(d.m){mode=d.m;updUI()}
 else if(d.wrapToggle!==undefined){bq.wrap=normalizeWrap(bq.wrap);bq.wrap.enabled=!bq.wrap.enabled;commit()}
 else if(d.ribbonToggle!==undefined){bq.wrap=normalizeWrap(bq.wrap);bq.wrap.ribbon=!bq.wrap.ribbon;commit()}

 else if(d.fold&&Object.hasOwn(FOLDS,d.fold)){bq.wrap=normalizeWrap(bq.wrap);bq.wrap.fold=d.fold;commit()}
 else if(d.bow&&Object.hasOwn(BOW,d.bow)){bq.wrap=normalizeWrap(bq.wrap);bq.wrap.bow=d.bow;commit()}
 else if(d.col&&it){it.c=d.col;commit()}
 else if(d.a==="done")setSheet(false);
 else if(d.a==="del")removeSel();else if(d.a==="dup"){if(it)addFlower(it.a);else addFlower("rose-proc")}
 else if(d.a==="auto"){autoArrange();commit()}else if(d.a==="seed"){bq.seed=bq.seed%99+1;autoArrange();commit()}
 else if(d.a==="rst"&&it){place(it,bq.items.indexOf(it));relax([it]);commit()}
 else if(d.a==="colall"&&it){bq.items.forEach(i=>{if(asset(i.a)?.colors)i.c=it.c});commit()}
 else if(d.s==="save"){try{localStorage.setItem(KEY,JSON.stringify(toObj()));toast("Saved on this device")}catch(x){toast("Save failed: "+x.message)}}
 else if(d.s==="load"||d.s==="new"){if(armed!==d.s){armed=d.s;updUI();setTimeout(()=>{if(armed===d.s){armed=null;updUI()}},3000);return}armed=null;
  if(d.s==="new"){bq={seed:1,full:1,layout:"dome",wrap:defaultWrap(),items:[]};sel=null;commit()}else{try{const r=localStorage.getItem(KEY);if(!r)return toast("No saved design found");applyDesign(JSON.parse(r)).catch(x=>toast("Load failed: "+x.message))}catch(x){toast("Load failed: "+x.message)}}}
 else if(d.s==="exp"){const t=JSON.stringify(toObj(),null,1);$("js").value=t;try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>{})}catch(x){}try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download="bouquet.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(x){}toast("JSON ready (copy from the box)")}
 else if(d.s==="imp"){try{applyDesign(JSON.parse($("js").value)).catch(x=>toast("Import failed: "+x.message))}catch(x){toast("Import failed: invalid JSON")}}});
P_.addEventListener("input",e=>{const t=e.target,it=cur();if(t.dataset.k&&it){it[t.dataset.k]=+t.value;const out=t.closest("label")?.querySelector("output");if(out)out.textContent=Number(t.value).toFixed(2);updateOne(it)}else if(t.dataset.adj){const A=CATALOG.filter(a=>a.approx).pop();A.adj[t.dataset.adj]=+t.value;studioRefresh(true)}});
P_.addEventListener("change",e=>{const t=e.target;if(t.dataset.k)commit();else if(t.id==="fu"){bq.full=+t.value;autoArrange();commit()}
 else if(t.id==="layout"){bq.layout=t.value;autoArrange();commit()}else if(t.id==="fq"){flt.q=t.value;updUI()}else if(t.id==="fc"){flt.cat=t.value;updUI()}else if(t.id==="fa"){flt.av=t.value;updUI()}else if(t.id==="gf"&&t.files[0]){importGLB(t.files[0]);t.value=""}});

  paperMeshCount:Object.values(paperMeshes).filter(mesh=>mesh.visible).length,
  paperTriangles:paperMeshes[normalizeWrap(bq.wrap).fold].geometry.index.count/3,
  bowDepth:(()=>{const bounds=new T.Box3().setFromObject(bowParts);return Number((bounds.max.z-bounds.min.z).toFixed(4))})(),flowerCount:bq.items.length,quality:QN[st.q],radius:st.r,
  selectedScreen:v?{x:(v.x+1)*cv.clientWidth/2,y:(1-v.y)*cv.clientHeight/2}:null};
};
for(let i=0;i<5;i++)bq.items.push({id:nid,n:nid++,a:"rose-proc",c:"blush",x:0,y:.36,z:0,r:0,s:1});autoArrange();hist=[snap()];hix=0;

try{setQuality();$("bQ").textContent="Quality: "+QN[st.q];resetView();rebuild();requestAnimationFrame(frame)}catch(e){fail("Initialization failed",e)}
};
